<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Old School House – 3D walk-through</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfe2f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.panel{position:absolute;background:rgba(22,26,32,.74);color:#f3efe6;border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
#top{top:12px;left:12px;max-width:min(330px,calc(100% - 48px))}
#top h1{font-size:15px;margin:0 0 2px;font-weight:650;letter-spacing:.2px}
#top .sub{opacity:.7;font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
button,select{font:inherit;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{background:rgba(255,255,255,.16)}
button.on{background:#e8c66a;color:#1d1d1d;border-color:#e8c66a}
select{max-width:100%}
select option{color:#000}
label{display:flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
label.dis{opacity:.4;pointer-events:none}
.sun{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15)}
.sun .sh{display:flex;justify-content:space-between;gap:8px;font-size:12px}.sun .sh span:last-child{opacity:.8;text-align:right}
.sl{display:grid;grid-template-columns:34px 1fr 74px;gap:6px;margin-top:5px;font-size:12px}.sl input{width:100%;accent-color:#e8c66a}.sl span{opacity:.85;text-align:right}
.sun button{padding:3px 8px;font-size:12px}
#room.fut{background:rgba(120,82,10,.82)}
#room{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;padding:7px 16px;white-space:nowrap}
#game{top:12px;right:12px;display:flex;gap:8px;align-items:center;padding:8px 10px}
#gStat{font-variant-numeric:tabular-nums;font-size:13px}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(20,22,26,.85);color:#fff;font-size:18px;font-weight:600;padding:12px 20px;border-radius:14px;opacity:0;transition:opacity .35s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
@media (max-width:640px){#game{top:auto;bottom:12px;left:12px;right:auto}}
#mapwrap{right:12px;bottom:12px;padding:6px 6px 4px}
#mapwrap .t{font-size:11px;opacity:.8;margin:0 2px 4px;display:flex;justify-content:space-between}
#map{display:block;border-radius:8px;cursor:crosshair}
#help{left:12px;bottom:12px;font-size:12px;max-width:min(300px,calc(100% - 300px));line-height:1.45}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.15);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.7)}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:#333}
@media (max-width:640px){#help{display:none}#room{top:auto;bottom:220px}#mapwrap canvas{width:190px!important;height:auto!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="panel">
  <h1>Old School House, Church Road</h1>
  <div class="sub">3D model from the floor plan · approx. 1,852 sq ft + garage</div>
  <div class="row">
    <button id="bWalk" class="on">🚶 Walk</button>
    <button id="bDoll">🏠 Dollhouse</button>
  </div>
  <div class="row"><span style="opacity:.75">Layout:</span>
    <button id="bCur" class="on">As it is now</button>
    <button id="bFut">Planned</button>
  </div>
  <div class="row">
    <label id="lRoof" class="dis"><input type="checkbox" id="cRoof"> Roof</label>
    <label id="lUp" class="dis"><input type="checkbox" id="cUp" checked> First floor</label>
  </div>
  <div class="sun">
    <div class="sh"><span>☀️ Sun</span><span id="sunInfo"></span></div>
    <label class="sl">Date<input type="range" id="sDay" min="1" max="365"><span id="sDayL"></span></label>
    <label class="sl">Time<input type="range" id="sTime" min="0" max="1435" step="5"><span id="sTimeL"></span></label>
    <div class="row" style="margin-top:2px"><button id="sNow">Now</button><button data-d="172">Midsummer</button><button data-d="80">Equinox</button><button data-d="355">Midwinter</button><button id="sPlay">▶ Play day</button></div>
  </div>
  <div class="row"><select id="go"><option value="">Jump to a room…</option></select></div>
</div>
<div id="room" class="panel">Driveway</div>
<div id="game" class="panel"><button id="gStart">🐈 Find the cat</button><span id="gStat"></span><button id="gHint" hidden>🔊 Hint</button><button id="gStop" hidden>✕</button></div>
<div id="toast"></div>
<div id="help" class="panel"></div>
<div id="mapwrap" class="panel"><div class="t"><span id="mapFloor">Ground floor</span><span>click to jump</span></div><canvas id="map"></canvas></div>
<div id="joy"><i></i></div>
<div id="err">Sorry — this 3D view needs WebGL, which isn't available in this browser.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
// ---------- coordinate helpers (floor-plan pixels -> metres) ----------
var PODGLASS=null,NIGHT=0,SCREEN=null;const IZZY={flames:[],stars:null,light:null};
const S=1/64, OX=750, OY=850;
const X=p=>(p-OX)*S, Z=p=>(p-OY)*S;
const PX=x=>x/S+OX, PY=z=>z/S+OY;
const col=h=>new THREE.Color(h).convertSRGBToLinear();
const rnd=(a,b)=>a+Math.random()*(b-a);

const canvas=document.getElementById('c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){document.getElementById('err').style.display='flex';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
scene.background=col('#9fc6ea');
scene.fog=new THREE.Fog(col('#c4daec'),70,280);
const camera=new THREE.PerspectiveCamera(70,1,0.05,700);
camera.rotation.order='YXZ';

const hemi=new THREE.HemisphereLight(col('#e4f0ff'),col('#8d7b5a'),0.8);scene.add(hemi);
const amb=new THREE.AmbientLight(0xffffff,0.12);scene.add(amb);
const sun=new THREE.DirectionalLight(col('#fff1d6'),1.7);
sun.position.set(-16,30,24);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:100});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;
scene.add(sun);

// ---------- procedural textures ----------
const maxAniso=renderer.capabilities.getMaxAnisotropy();
function tex(draw,size=512){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');draw(g,size);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;return t;}
function noise(g,s,n,a){for(let i=0;i<n;i++){const v=Math.random()*255|0;g.fillStyle=`rgba(${v},${v},${v},${a})`;g.fillRect(Math.random()*s,Math.random()*s,rnd(1,3),rnd(1,3));}}
function hslOf(hex){const o={};new THREE.Color(hex).getHSL(o);return o;}
function shade(hex,f){const o=hslOf(hex);return `hsl(${o.h*360},${o.s*100}%,${Math.min(100,o.l*100*f)}%)`;}
function bond(g,s,rows,cols,gap,fill){const h=s/rows,w=s/cols;for(let r=0;r<rows;r++){const off=(r%2)*w/2;for(let c=-1;c<=cols;c++){g.fillStyle=fill();g.fillRect(c*w+off+gap,r*h+gap,w-gap*2,h-gap*2);}}}

const stoneTex=tex((g,s)=>{g.fillStyle='#b4a37e';g.fillRect(0,0,s,s);const hs=[];for(let i=0;i<8;i++)hs.push(rnd(.7,1.3));const sum=hs.reduce((a,b)=>a+b);let y=0;for(const h0 of hs){const h=h0/sum*s;const x0=rnd(0,s);let acc=0;while(acc<s-1){const w=Math.min(rnd(s*.1,s*.24),s-acc);g.fillStyle=`hsl(${rnd(37,46)},${rnd(26,40)}%,${rnd(67,80)}%)`;for(const dx of[0,-s])g.fillRect(((x0+acc)%s)+dx+2,y+2,w-3,h-3);acc+=w;}y+=h;}noise(g,s,9000,.07);});
const brickTex=tex((g,s)=>{g.fillStyle='#b5a796';g.fillRect(0,0,s,s);bond(g,s,26,9,1,()=>`hsl(${rnd(6,18)},${rnd(35,52)}%,${rnd(30,43)}%)`);noise(g,s,8000,.07);});
const buffPave=tex((g,s)=>{g.fillStyle='#8d8270';g.fillRect(0,0,s,s);bond(g,s,20,10,1,()=>`hsl(${rnd(36,44)},${rnd(30,42)}%,${rnd(62,74)}%)`);noise(g,s,6000,.06);});
const bluePave=tex((g,s)=>{g.fillStyle='#3f434a';g.fillRect(0,0,s,s);bond(g,s,20,10,1.2,()=>`hsl(${rnd(210,230)},${rnd(6,12)}%,${rnd(30,42)}%)`);noise(g,s,6000,.06);});
const slateTex=tex((g,s)=>{g.fillStyle='#24272b';g.fillRect(0,0,s,s);bond(g,s,8,7,1,()=>`hsl(${rnd(200,220)},${rnd(4,10)}%,${rnd(28,40)}%)`);noise(g,s,6000,.06);});
const grassTex=tex((g,s)=>{g.fillStyle='#5d8a3a';g.fillRect(0,0,s,s);for(let i=0;i<14000;i++){g.strokeStyle=`hsla(${rnd(75,100)},${rnd(35,55)}%,${rnd(28,48)}%,.55)`;const x=Math.random()*s,y=Math.random()*s;g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd(-2,2),y+rnd(3,7));g.stroke();}});
const pebbleTex=tex((g,s)=>{g.fillStyle='#bdb4a3';g.fillRect(0,0,s,s);noise(g,s,40000,.18);});
const concreteTex=tex((g,s)=>{g.fillStyle='#a19d95';g.fillRect(0,0,s,s);noise(g,s,20000,.06);});
const cladTex=tex((g,s)=>{g.fillStyle='#1d2740';g.fillRect(0,0,s,s);const n=14,h=s/n;for(let r=0;r<n;r++){g.fillStyle=`hsl(222,${rnd(32,40)}%,${rnd(16,21)}%)`;g.fillRect(0,r*h+2,s,h-2);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,r*h,s,2);}noise(g,s,3000,.04);});
const timberTex=tex((g,s)=>{g.fillStyle='#4b3a2b';g.fillRect(0,0,s,s);const n=10,h=s/n;for(let r=0;r<n;r++){g.fillStyle=`hsl(28,${rnd(25,35)}%,${rnd(20,28)}%)`;g.fillRect(0,r*h+2,s,h-2);}noise(g,s,4000,.06);});
function carpetTex(base){return tex((g,s)=>{g.fillStyle=base;g.fillRect(0,0,s,s);noise(g,s,30000,.05);},256);}
function woodTex(base){return tex((g,s)=>{g.fillStyle=base;g.fillRect(0,0,s,s);const rows=10,h=s/rows;for(let r=0;r<rows;r++){const x0=rnd(0,s);for(let k=0;k<2;k++){g.fillStyle=shade(base,rnd(.86,1.12));for(const dx of[0,-s])g.fillRect(((x0+k*s/2)%s)+dx,r*h,s/2-1.5,h-1.5);}}for(let i=0;i<500;i++){g.strokeStyle=`rgba(0,0,0,${rnd(.03,.08)})`;g.beginPath();const y=rnd(0,s);g.moveTo(0,y);g.bezierCurveTo(s*.3,y+rnd(-3,3),s*.6,y+rnd(-3,3),s,y);g.stroke();}});}
function tileTex(base,n,grout){return tex((g,s)=>{g.fillStyle=grout;g.fillRect(0,0,s,s);const w=s/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){g.fillStyle=shade(base,rnd(.97,1.03));g.fillRect(i*w+1.5,j*w+1.5,w-3,w-3);}noise(g,s,3000,.035);});}

// ---------- materials ----------
function M(o){const c=o.color;delete o.color;const m=new THREE.MeshStandardMaterial(Object.assign({roughness:.9,metalness:0},o));if(c)m.color=col(c);return m;}
const paintCache={};const paint=h=>paintCache[h]||(paintCache[h]=M({color:h}));
const stoneMat=M({map:stoneTex}), brickMat=M({map:brickTex}), slateMat=M({map:slateTex,roughness:.7,side:THREE.DoubleSide});
const stoneEnd=M({map:stoneTex,side:THREE.DoubleSide});
const cladMat=M({map:cladTex,roughness:.6}), cladEnd=M({map:cladTex,roughness:.6,side:THREE.DoubleSide});
const timberMat=M({map:timberTex,side:THREE.DoubleSide});
const white=paint('#f4f1ea'), ceilMat=M({color:'#f7f5f0',roughness:1});
const glassMat=M({color:'#bcd6ea',roughness:.05,metalness:.1,transparent:true,opacity:.22,depthWrite:false});
const frameMat=M({color:'#f6f6f2',roughness:.5});
const oak=M({color:'#c49a62',roughness:.6}), beech=M({color:'#d9bb8f',roughness:.6}), mahog=M({color:'#5d3020',roughness:.55});
const whiteUnit=M({color:'#f3f1ec',roughness:.5}), wtDark=M({color:'#2d3236',roughness:.35}), wtLight=M({color:'#cfcac2',roughness:.45});
const chrome=M({color:'#d6d6d6',metalness:.9,roughness:.25}), porcelain=M({color:'#fafaf8',roughness:.25});
const black=M({color:'#1b1b1c',roughness:.5}), darkwood=M({color:'#4a2c1a',roughness:.5}), copper=M({color:'#b8733d',metalness:.6,roughness:.35});
const teal=M({color:'#4f8487',roughness:.6}), navy=M({color:'#1c2742',roughness:.5}), fabric=M({color:'#8fa6b3'});
const carpetM=c=>M({map:carpetTex(c),roughness:1}), woodM=c=>M({map:woodTex(c),roughness:.55}), tileM=(c,n,g)=>M({map:tileTex(c,n,g),roughness:.4});
const buffMat=M({map:buffPave}), blueMat=M({map:bluePave}), grassMat=M({map:grassTex}), pebbleMat=M({map:pebbleTex}), concMat=M({map:concreteTex});

// ---------- groups & physics lists ----------
const ground=new THREE.Group(), upper=new THREE.Group(), ceil=new THREE.Group(), roof=new THREE.Group(), outdoor=new THREE.Group();
scene.add(ground,upper,ceil,roof,outdoor);
let ST=null,state='cur';const sg={cur:new THREE.Group(),fut:new THREE.Group()};scene.add(sg.cur,sg.fut);sg.fut.visible=false;const sgU={cur:new THREE.Group(),fut:new THREE.Group()};upper.add(sgU.cur,sgU.fut);sgU.fut.visible=false;
const colliders=[], walkables=[];

function worldUV(geo,tile=2,swap=false){const p=geo.attributes.position,n=geo.attributes.normal;const uv=new Float32Array(p.count*2);for(let i=0;i<p.count;i++){const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));let u,v;if(ay>=ax&&ay>=az){u=p.getX(i);v=p.getZ(i);if(swap){const t=u;u=v;v=t;}}else if(ax>=az){u=p.getZ(i);v=p.getY(i);}else{u=p.getX(i);v=p.getY(i);}uv[i*2]=u/tile;uv[i*2+1]=v/tile;}geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));}

function box(x1,y1,x2,y2,h0,h1,mat,parent,opt={}){
  if(ST&&parent===ground)parent=sg[ST];else if(ST&&parent===upper)parent=sgU[ST];
  const a=X(Math.min(x1,x2)),b=X(Math.max(x1,x2)),c=Z(Math.min(y1,y2)),d=Z(Math.max(y1,y2));
  const g=new THREE.BoxGeometry(b-a,h1-h0,d-c);g.translate((a+b)/2,(h0+h1)/2,(c+d)/2);worldUV(g,opt.tile||2);
  const m=new THREE.Mesh(g,mat);m.castShadow=opt.cast!==false;m.receiveShadow=true;parent.add(m);m.userData.st=ST;
  if(opt.collide)colliders.push({a,b,c,d,h0,h1,st:ST});
  if(opt.walk)walkables.push(m);
  return m;
}

// ---------- rooms ----------
const R=(n,f,r,wall,floor,fr)=>({n,f,r,wall,floor,fr});
const rooms=[
 R('Cloakroom / store',0,[[120,583,240,700]],'#efe9dc',tileM('#e3dacb',6,'#b9b0a2')),
 R('Hall & stairs',0,[[30,700,380,830],[240,583,380,700]],'#efe9dc',carpetM('#b8b0a7')),
 R('Lounge',0,[[30,830,295,1105]],'#d9c3b4',carpetM('#bdb2a6')),
 R('Dining room',0,[[295,830,555,1105]],'#ece5d6',carpetM('#c8baa4')),
 R('Kitchen',0,[[380,583,555,830]],'#ece3cf',tileM('#e9e0cc',5,'#c7bca8')),
 R('Rear lobby',0,[[555,755,730,830]],'#ece3cf',tileM('#e9e0cc',5,'#c7bca8')),
 R('Bathroom',0,[[555,830,730,952]],'#efe9e0',tileM('#e2dccf',6,'#bdb5a6')),
 R('Office / bedroom',0,[[730,755,915,952]],'#f1ede4',tileM('#ebe8e1',6,'#c9c4ba')),
 R('Bedroom (ground floor)',0,[[555,952,915,1105]],'#e9c4a5',carpetM('#a39a8e')),
 R('Lounge / diner (annexe)',0,[[915,755,1248,1105]],'#eeebe6',woodM('#5b4637')),
 R('Kitchen (annexe)',0,[[1248,755,1463,940]],'#f2f0eb',woodM('#5b4637')),
 R('Passage (annexe)',0,[[1248,940,1302,1105]],'#f2f0eb',woodM('#5b4637')),
 R('Bathroom (annexe)',0,[[1302,940,1463,1105]],'#c9a23a',woodM('#9a7553')),
 R('Bedroom 3',1,[[362,583,555,750]],'#f1e6cf',carpetM('#ccbda3')),
 R('Cloakroom WC',1,[[415,750,555,834]],'#efe7d7',tileM('#dccdb3',5,'#b9ab93')),
 R('Landing',1,[[205,583,415,834]],'#efe9dc',carpetM('#b8b0a7'),[[205,760,415,834],[205,583,240,760]]),
 R('Bedroom 1',1,[[30,834,290,1105]],'#eee7d6',carpetM('#c2bab1')),
 R('Bedroom 2',1,[[290,834,555,1105]],'#ece5d8',carpetM('#c2bab1')),
];
function roomAt(px,py,f){for(const r of rooms){if(r.f!==f)continue;for(const q of r.r)if(px>=q[0]&&px<=q[2]&&py>=q[1]&&py<=q[3])return r;}return null;}
const FUT={'Kitchen':['Snug / office',carpetM('#9c8f7e')],'Dining room':['Casual lounge'],'Bedroom (ground floor)':['Library corridor',woodM('#b68a5a'),'#ebe3d3'],'Office / bedroom':['Bedroom 4',carpetM('#b9ada0')],'Bedroom 2':["Kay & Carey's room"],'Bedroom 1':["Izzy's room",carpetM('#b7a48e'),'#ede2c9'],'Bedroom 3':['Family shower room',tileM('#d8d5ce',3,'#a29e96'),'#ecece7'],'Cloakroom WC':['Family shower room',tileM('#d8d5ce',3,'#a29e96'),'#ecece7'],'Lounge / diner (annexe)':['Kitchen / diner'],'Kitchen (annexe)':['Utility room']};
for(const r of rooms){if(FUT[r.n]){r.nf=FUT[r.n][0];r.ff=FUT[r.n][1];r.wf=FUT[r.n][2];}}
const rname=r=>state==='fut'&&r.nf?r.nf:r.n;
for(const r of rooms){const base=r.f?2.8:0;for(const q of (r.fr||r.r)){if(r.ff){ST='cur';box(q[0],q[1],q[2],q[3],base,base+.03,r.floor,r.f?upper:ground,{walk:true,cast:false});ST='fut';box(q[0],q[1],q[2],q[3],base,base+.03,r.ff,r.f?upper:ground,{walk:true,cast:false});ST=null;}else box(q[0],q[1],q[2],q[3],base,base+.03,r.floor,r.f?upper:ground,{walk:true,cast:false});}}

// ---------- walls ----------
// ---------- opening doors ----------
const doors=[],doorWhite=M({color:'#f3f1ec',roughness:.5}),doorExt=M({color:'#3d4a4f',roughness:.5}),knobM=M({color:'#c9a03c',metalness:.8,roughness:.3}),steelM=M({color:'#1c1e20',metalness:.55,roughness:.4});
const doorParent=base=>ST?(base>1?sgU[ST]:sg[ST]):(base>1?upper:ground);
function regDoor(pivs,meshes,rect4,base,h,open){const col={a:X(rect4[0]),b:X(rect4[2]),c:Z(rect4[1]),d:Z(rect4[3]),h0:base,h1:base+h,st:ST};const d={pivs,t:open?1:0,target:open?1:0,st:ST,col};col.door=d;colliders.push(col);for(const m of meshes)m.userData.door=d;doors.push(d);applyDoor(d);}
function applyDoor(d){for(const q of d.pivs)q.p.rotation[q.axis||'y']=q.sgn*Math.PI/2*(q.max||.96)*d.t;}
function addDoor(horiz,C,o1,o2,base,s,mat,open){

function updateWalk(dt){
  let f=0,s=0;
  if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyA)s-=1;if(keys.KeyD)s+=1;
  if(keys.ArrowLeft||keys.KeyQ)yaw+=1.9*dt;if(keys.ArrowRight||keys.KeyE)yaw-=1.9*dt;
  f-=joy.y;s+=joy.x;const l=Math.hypot(f,s);if(l>1){f/=l;s/=l;}
  const sp=(keys.ShiftLeft||keys.ShiftRight?5:2.4)*dt;
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const dx=(fx*f+rx*s)*sp,dz=(fz*f+rz*s)*sp;
  if(dx&&!blocked(pos.x+dx,pos.z,pos.y))pos.x+=dx;
  if(dz&&!blocked(pos.x,pos.z+dz,pos.y))pos.z+=dz;
  const fl=floorAt(pos.x,pos.z,pos.y);
  if(fl!==null&&fl>=pos.y-.001){pos.y+=(fl-pos.y)*Math.min(1,dt*18);if(Math.abs(fl-pos.y)<.005)pos.y=fl;vy=0;}
  else{vy-=9.8*dt;pos.y+=vy*dt;const lim=fl===null?-5:fl;if(pos.y<=lim){pos.y=lim;vy=0;}}
}

  // the live render of this very view (yes, it recurses)
  const rx=px0+chatW+8,ry=py0+8,rw=bw-chatW-16,rh=bh-48-16;c.fillStyle='#222';c.fillRect(rx,ry,rw,rh);
  try{const src=renderer.domElement,sa=src.width/src.height,ta=rw/rh;let sw=src.width,sh=src.height,sx=0,sy=0;if(sa>ta){sw=sh*ta;sx=(src.width-sw)/2;}else{sh=sw/ta;sy=(src.height-sh)/2;}c.drawImage(src,sx,sy,sw,sh,rx,ry,rw,rh);}catch(e){}
  c.fillStyle='rgba(0,0,0,.55)';c.fillRect(rx,ry+rh-20,rw,20);c.fillStyle='#fff';c.font='11px system-ui';c.fillText('Old School House – 3D walk-through · live',rx+8,ry+rh-6);
  S2.tex.needsUpdate=true;}

function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='walk'){updateWalk(dt);camera.position.set(pos.x,pos.y+1.6,pos.z);camera.rotation.set(pitch,yaw,0);}else updateOrbit();
  const n=(mode==='walk'?placeName():'Dollhouse view')+(state==='fut'?' · planned':'');if(n!==lastName){lastName=n;roomEl.textContent=n;}
  animatePets(dt,now/1000);updateCat(dt,now/1000);updateGame();
  for(const d of doors)if(d.t!==d.target){d.t=d.target>d.t?Math.min(d.target,d.t+dt*2.2):Math.max(d.target,d.t-dt*2.2);applyDoor(d);}
  if(state==='fut'){const T=now/1000;for(const f of IZZY.flames){const u=f.userData,k=1+.22*Math.sin(T*13+u.ph)+.12*Math.sin(T*29+u.ph2);f.scale.set(1,k,1);f.rotation.z=.08*Math.sin(T*7+u.ph);f.material.color.setHSL(.1+.015*Math.sin(T*5+u.ph),1,.6+.08*k);}
    IZZY.light.intensity=(.08+NIGHT*.9)*(1+.12*Math.sin(T*11)+.08*Math.sin(T*23));
    const st=IZZY.stars,ca=st.geometry.attributes.color,md=st.userData.meta,base=.12+.88*NIGHT;for(let i=0;i<md.length;i++){const m=md[i];const b=base*m.w*(.55+.45*Math.sin(T*m.sp+m.ph));ca.setXYZ(i,b,b*(.92+.08*m.tint),b*(.75+.25*m.tint));}ca.needsUpdate=true;}
  if(playing){sTime.value=Math.min(1435,+sTime.value+dt*90);updateSun();if(+sTime.value>=1435){playing=false;sPlay.textContent='▶ Play day';}}
  drawMap();renderer.render(scene,camera);
  if(SCREEN&&state==='fut'&&now-SCREEN.last>80){const d=SCREEN.pos.distanceTo(camera.position);if(d<9||mode==='doll'&&d<60){SCREEN.last=now;drawScreen(now/1000);}}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
